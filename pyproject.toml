[project]
name = "dialisis-patients"
version = "1.0.0"
description = "Microservicio de pacientes de Diálisis con arquitectura hexagonal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic-settings",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "pyjwt[crypto]>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patients"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
ignore = ["B008"]